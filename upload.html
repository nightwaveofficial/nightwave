<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Video</title>

<style>

body{
background:#0a0a0a;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.upload-box{
background:#111827;
padding:40px;
border-radius:20px;
width:350px;
text-align:center;
}

h1{
color:#8b5cf6;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
background:#1f2937;
color:white;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#8b5cf6;
border:none;
border-radius:10px;
font-size:18px;
color:white;
}

</style>

</head>

<body>

<div class="upload-box">

<h1>Upload Video</h1>

<input type="text" placeholder="Video Title">

<input type="file">

<button onclick="alert('Video Uploaded Successfully')">Upload</button>

</div>

</body>
</html>
