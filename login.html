<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightwave Login</title>

<style>

body{
background:#0a0a0a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.login-box{
background:#111827;
padding:40px;
border-radius:20px;
width:320px;
text-align:center;
}

h1{
color:#8b5cf6;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
background:#1f2937;
color:white;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#8b5cf6;
border:none;
border-radius:10px;
color:white;
font-size:18px;
}

p{
color:white;
margin-top:15px;
}

</style>

</head>

<body>

<div class="login-box">

<h1>NIGHTWAVE</h1>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button>Login</button>

<p>Create Account</p>

</div>

</body>
</html>
