<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>

body{
background:#0a0a0a;
font-family:Arial;
color:white;
text-align:center;
margin:0;
}

.profile-header{
padding:40px;
background:#111827;
}

.profile-header img{
width:120px;
height:120px;
border-radius:50%;
border:4px solid #8b5cf6;
object-fit:cover;
}

h1{
margin-top:15px;
color:#8b5cf6;
}

.bio{
color:lightgray;
margin-top:10px;
}

.stats{
display:flex;
justify-content:center;
gap:30px;
margin-top:20px;
}

.stat{
background:#1f2937;
padding:15px 25px;
border-radius:15px;
}

.section{
padding:30px;
}

.cards{
display:flex;
gap:20px;
overflow-x:auto;
padding-bottom:20px;
}

.card{
min-width:220px;
background:#111827;
border-radius:15px;
overflow:hidden;
}

.card img{
width:100%;
height:300px;
object-fit:cover;
}

.card h3{
padding:15px;
}

</style>

</head>

<body>

<div class="profile-header">

<img src="https://i.pravatar.cc/300">

<h1>Nightwave Creator</h1>

<p class="bio">
Streaming • Shorts • Entertainment
</p>

<div class="stats">

<div class="stat">
<h2>120K</h2>
<p>Followers</p>
</div>

<div class="stat">
<h2>340</h2>
<p>Videos</p>
</div>

<div class="stat">
<h2>15M</h2>
<p>Views</p>
</div>

</div>

</div>

<div class="section">

<h2>🎬 Uploaded Videos</h2>

<div class="cards">

<div class="card">
<img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=600&auto=format&fit=crop">
<h3>Cyber Night</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=600&auto=format&fit=crop">
<h3>Dark City</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?q=80&w=600&auto=format&fit=crop">
<h3>Shadow World</h3>
</div>

</div>

</div>

</body>
</html>
