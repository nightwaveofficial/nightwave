<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightwave</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0a0a0a;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:black;
position:sticky;
top:0;
}

.logo{
font-size:32px;
font-weight:bold;
color:#8b5cf6;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
}

.hero{
height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(to bottom, rgba(0,0,0,0.6), black),
url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop');
background-size:cover;
background-position:center;
}

.hero h1{
font-size:70px;
color:#8b5cf6;
}

.hero p{
font-size:24px;
margin-top:10px;
}

.hero button{
margin-top:20px;
padding:15px 35px;
font-size:20px;
background:#8b5cf6;
border:none;
border-radius:10px;
color:white;
}

.section{
padding:40px 20px;
}

.section h2{
margin-bottom:20px;
}

.cards{
display:flex;
gap:20px;
overflow-x:auto;
}

.card{
min-width:220px;
background:#111827;
border-radius:15px;
overflow:hidden;
}

.card img{
width:100%;
height:300px;
object-fit:cover;
}

.card h3{
padding:15px;
}

footer{
text-align:center;
padding:30px;
background:black;
margin-top:40px;
}

</style>
</head>

<body>

<header>
<div class="logo">NIGHTWAVE</div>

<nav>
<a href="#">Home</a>
<a href="#">Trending</a>
<a href="#">Movies</a>
<a href="#">Shorts</a>
</nav>
</header>

<section class="hero">

<h1>NIGHTWAVE</h1>

<p>Unlimited Streaming Experience</p>

<button>Watch Now</button>

</section>

<section class="section">

<h2>🔥 Trending Now</h2>

<div class="cards">

<div class="card">
<img src="https://picsum.photos/300/400?1">
<h3>Dark Warrior</h3>
</div>

<div class="card">
<img src="https://picsum.photos/300/400?2">
<h3>Night City</h3>
</div>

<div class="card">
<img src="https://picsum.photos/300/400?3">
<h3>Shadow Hunt</h3>
</div>

<div class="card">
<img src="https://picsum.photos/300/400?4">
<h3>Cyber World</h3>
</div>

</div>

</section>

<footer>

<p>© 2026 Nightwave. All Rights Reserved.</p>

</footer>

</body>
</html>
