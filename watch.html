<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Video</title>

<style>

body{
background:black;
color:white;
font-family:Arial;
text-align:center;
padding:30px;
}

h1{
color:#8b5cf6;
margin-bottom:20px;
}

video{
width:90%;
max-width:900px;
border-radius:20px;
}
<source src="https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
</style>

</head>

<body>

<h1>Now Playing</h1>
<button onclick="subscribeChannel(this)" style="padding:12px 25px;background:red;border:none;border-radius:10px;color:white;font-size:18px;margin-bottom:20px;">
🔔 Subscribe
</button>
<video controls>

<

</video>
<div style="margin-top:30px;">

<h2 style="color:#8b5cf6;">Comments</h2>

<input type="text" id="commentInput" placeholder="Write a comment..." style="padding:12px;width:300px;border:none;border-radius:10px;">

<button onclick="addComment()" style="padding:12px 20px;background:#8b5cf6;border:none;border-radius:10px;color:white;">
Post
</button>

<div id="comments" style="margin-top:20px;"></div>

</div>
<script>

function addComment(){

let input = document.getElementById("commentInput");

let comments = document.getElementById("comments");

if(input.value !== ""){

comments.innerHTML += "<p style='background:#111827;padding:10px;border-radius:10px;margin-top:10px;'>" + input.value + "</p>";

input.value = "";

}

}

</script>


function subscribeChannel(btn){

btn.innerHTML = "✅ Subscribed";
btn.style.background = "green";

}

</script>
</body>
</html>
